name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact pull request base SHA for a manually dispatched release check
        required: false
        type: string
      head_sha:
        description: Exact pull request head SHA for a manually dispatched release check
        required: false
        type: string
      pr_title:
        description: Pull request title for a manually dispatched release check
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: authmodules
          POSTGRES_PASSWORD: authmodules
          POSTGRES_USER: authmodules
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authmodules -d authmodules"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.head_sha || github.sha }}
      - name: Verify dispatched head
        if: inputs.head_sha != ''
        run: test "$(git rev-parse HEAD)" = "$AUTHMODULES_EXPECTED_HEAD_SHA"
        env:
          AUTHMODULES_EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - name: Install workspace dependencies
        run: npm ci
      - name: Check pull request title
        run: node scripts/check-pr-title.js
        env:
          AUTHMODULES_PR_TITLE: ${{ github.event.pull_request.title || inputs.pr_title }}
      - name: Check monorepo
        run: npm run check
        env:
          AUTHMODULES_POSTGRES_URL: postgres://authmodules:authmodules@127.0.0.1:5432/authmodules
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
