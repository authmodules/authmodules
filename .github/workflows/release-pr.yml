name: Prepare release pull request

on:
  workflow_dispatch:

concurrency:
  group: release-please-pr
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - name: Install release tooling
        run: npm ci --ignore-scripts
      - name: Reject conflicting release pull requests
        run: |
          pull_requests="$(
            gh api \
              --paginate \
              --slurp \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100"
          )"
          conflicts="$(
            jq \
              --arg branch "release-please--branches--main" \
              --arg repository "$GITHUB_REPOSITORY" \
              '[
                .[][]
                | select(
                    .head.ref == $branch
                    and .head.repo.full_name != $repository
                  )
              ] | length' \
              <<<"$pull_requests"
          )"
          if [[ "$conflicts" != 0 ]]; then
            echo "A fork uses the reserved release pull request branch" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create or update release pull request
        run: node scripts/create-release-pr.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release pull request
        id: release_pr
        run: |
          pull_requests="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&head=${GITHUB_REPOSITORY_OWNER}:release-please--branches--main&per_page=2"
          )"
          count="$(jq length <<<"$pull_requests")"
          if [[ "$count" == 0 ]]; then
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "No open release pull request"
            exit 0
          fi
          if [[ "$count" != 1 ]]; then
            echo "Expected exactly one open release pull request" >&2
            exit 1
          fi
          echo "pr_number=$(jq -r '.[0].number' <<<"$pull_requests")" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq -r '.[0].head.ref' <<<"$pull_requests")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.[0].head.sha' <<<"$pull_requests")" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout release pull request
        if: steps.release_pr.outputs.pr_number != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release_pr.outputs.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh root workspace lockfile
        if: steps.release_pr.outputs.pr_number != ''
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        if: steps.release_pr.outputs.pr_number != ''
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update release workspace lockfile"
          git push origin "HEAD:${RELEASE_BRANCH}"
        env:
          RELEASE_BRANCH: ${{ steps.release_pr.outputs.head_ref }}
      - name: Dispatch exact release pull request check
        if: steps.release_pr.outputs.pr_number != ''
        run: |
          pull_request="$(
            gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json baseRefOid,headRefOid,title
          )"
          gh workflow run check.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_BRANCH" \
            -f "base_sha=$(jq -r '.baseRefOid' <<<"$pull_request")" \
            -f "head_sha=$(jq -r '.headRefOid' <<<"$pull_request")" \
            -f "pr_title=$(jq -r '.title' <<<"$pull_request")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.release_pr.outputs.pr_number }}
          RELEASE_BRANCH: ${{ steps.release_pr.outputs.head_ref }}
