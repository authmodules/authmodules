name: Prepare release pull request

on:
  workflow_dispatch:

concurrency:
  group: release-please-pr
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - name: Install release tooling
        run: npm ci --ignore-scripts
      - name: Create or update release pull request
        run: >-
          npm exec -- release-please release-pr
          --repo-url="${GITHUB_REPOSITORY}"
          --target-branch=main
          --token="${RELEASE_PLEASE_TOKEN}"
          --config-file=release-please-config.json
          --manifest-file=.release-please-manifest.json
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release pull request
        id: release_pr
        run: node scripts/dispatch-release-pr-check.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout release pull request
        if: steps.release_pr.outputs.pr_number != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release_pr.outputs.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh root workspace lockfile
        if: steps.release_pr.outputs.pr_number != ''
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        if: steps.release_pr.outputs.pr_number != ''
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update release workspace lockfile"
          git push origin "HEAD:${RELEASE_BRANCH}"
        env:
          RELEASE_BRANCH: ${{ steps.release_pr.outputs.head_ref }}
      - name: Dispatch exact release pull request check
        run: node scripts/dispatch-release-pr-check.js
        env:
          AUTHMODULES_DISPATCH_CHECK: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
