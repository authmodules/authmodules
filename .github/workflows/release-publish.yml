name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - .release-please-manifest.json
  workflow_dispatch:
    inputs:
      release_base_sha:
        description: Exact parent SHA of the merged Release Please commit
        required: true
        type: string
      release_head_sha:
        description: Exact merged Release Please commit SHA to repair
        required: true
        type: string

concurrency:
  group: release-publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.context.outputs.base_sha }}
      count: ${{ steps.release_plan.outputs.count }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      matrix: ${{ steps.release_plan.outputs.matrix }}
      release: ${{ steps.trigger.outputs.release }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release context
        id: context
        run: node scripts/resolve-release-publish-context.js
        env:
          AUTHMODULES_PUSH_BASE_SHA: ${{ github.event.before }}
          AUTHMODULES_REPAIR_BASE_SHA: ${{ inputs.release_base_sha }}
          AUTHMODULES_REPAIR_HEAD_SHA: ${{ inputs.release_head_sha }}
      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ steps.context.outputs.head_sha }}
      - name: Detect bootstrap or release manifest
        id: trigger
        working-directory: release-source
        run: node scripts/detect-release-trigger.js
        env:
          AUTHMODULES_BASE_SHA: ${{ steps.context.outputs.base_sha }}
      - name: Verify Release Please merge
        if: steps.trigger.outputs.release == 'true'
        run: node scripts/verify-release-commit.js
        env:
          AUTHMODULES_BASE_SHA: ${{ steps.context.outputs.base_sha }}
          AUTHMODULES_HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create changed package matrix
        if: steps.trigger.outputs.release == 'true'
        id: release_plan
        working-directory: release-source
        run: node scripts/create-release-plan.js
        env:
          AUTHMODULES_BASE_SHA: ${{ steps.context.outputs.base_sha }}
          AUTHMODULES_HEAD_SHA: ${{ steps.context.outputs.head_sha }}

  check:
    if: needs.plan.outputs.release == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: authmodules
          POSTGRES_PASSWORD: authmodules
          POSTGRES_USER: authmodules
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authmodules -d authmodules"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.head_sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - name: Install workspace dependencies
        run: npm ci
      - name: Check exact release commit
        run: npm run check
        env:
          AUTHMODULES_POSTGRES_URL: postgres://authmodules:authmodules@127.0.0.1:5432/authmodules

  publish:
    if: github.event_name == 'push' && needs.plan.outputs.release == 'true'
    needs:
      - plan
      - check
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-packages
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.head_sha }}
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          path: .release-tooling
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@authmodules'
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - name: Install workspace dependencies
        run: npm ci
      - name: Build package
        run: npm run build --workspace "${PACKAGE_NAME}"
        env:
          PACKAGE_NAME: ${{ matrix.package }}
      - name: Prepare exact tarball and attestations
        id: evidence
        run: node .release-tooling/scripts/prepare-package-release-evidence.js
        env:
          AUTHMODULES_CONTRACTS_DIRECTORY: packages/contracts
          AUTHMODULES_EVIDENCE_DIRECTORY: ${{ runner.temp }}/release-evidence/${{ matrix.name }}
          AUTHMODULES_PACKAGE_DIRECTORY: ${{ matrix.path }}
          AUTHMODULES_RELEASE_SHA: ${{ needs.plan.outputs.head_sha }}
          AUTHMODULES_WORKFLOW_SHA: ${{ github.workflow_sha }}
      - name: Resolve registry publication state
        id: publication
        run: node .release-tooling/scripts/resolve-package-publication.js
        env:
          AUTHMODULES_EXPECTED_INTEGRITY: ${{ steps.evidence.outputs.package_integrity }}
          AUTHMODULES_PACKAGE_DIRECTORY: ${{ matrix.path }}
          AUTHMODULES_PACKAGE_TARBALL: ${{ steps.evidence.outputs.package_tarball }}
          AUTHMODULES_PUBLICATION_MODE: resolve
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact tarball to GitHub Packages
        if: steps.publication.outputs.publish == 'true'
        run: npm publish "${PACKAGE_TARBALL}" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TARBALL: ${{ steps.evidence.outputs.package_tarball }}
      - name: Verify registry package integrity
        run: node .release-tooling/scripts/resolve-package-publication.js
        env:
          AUTHMODULES_EXPECTED_INTEGRITY: ${{ steps.evidence.outputs.package_integrity }}
          AUTHMODULES_PACKAGE_DIRECTORY: ${{ matrix.path }}
          AUTHMODULES_PACKAGE_TARBALL: ${{ steps.evidence.outputs.package_tarball }}
          AUTHMODULES_PUBLICATION_MODE: verify
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          predicate-path: ${{ steps.evidence.outputs.provenance_path }}
          predicate-type: https://slsa.dev/provenance/v1
          subject-path: ${{ steps.evidence.outputs.package_tarball }}
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.evidence.outputs.package_tarball }}
          sbom-path: ${{ steps.evidence.outputs.sbom_path }}
      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}-${{ matrix.version }}-${{ needs.plan.outputs.head_sha }}
          path: |
            ${{ steps.evidence.outputs.package_tarball }}
            ${{ steps.evidence.outputs.provenance_path }}
            ${{ steps.evidence.outputs.sbom_path }}
            ${{ steps.evidence.outputs.evidence_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  repair:
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.release == 'true'
    needs:
      - plan
      - check
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-packages
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.head_sha }}
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          path: .release-tooling
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@authmodules'
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - name: Install workspace dependencies
        run: npm ci
      - name: Build package
        run: npm run build --workspace "${PACKAGE_NAME}"
        env:
          PACKAGE_NAME: ${{ matrix.package }}
      - name: Prepare exact tarball and attestations
        id: evidence
        run: node .release-tooling/scripts/prepare-package-release-evidence.js
        env:
          AUTHMODULES_CONTRACTS_DIRECTORY: packages/contracts
          AUTHMODULES_EVIDENCE_DIRECTORY: ${{ runner.temp }}/release-evidence/${{ matrix.name }}
          AUTHMODULES_PACKAGE_DIRECTORY: ${{ matrix.path }}
          AUTHMODULES_RELEASE_SHA: ${{ needs.plan.outputs.head_sha }}
          AUTHMODULES_WORKFLOW_SHA: ${{ github.workflow_sha }}
      - name: Verify existing registry package integrity
        run: node .release-tooling/scripts/resolve-package-publication.js
        env:
          AUTHMODULES_EXPECTED_INTEGRITY: ${{ steps.evidence.outputs.package_integrity }}
          AUTHMODULES_PACKAGE_DIRECTORY: ${{ matrix.path }}
          AUTHMODULES_PACKAGE_TARBALL: ${{ steps.evidence.outputs.package_tarball }}
          AUTHMODULES_PUBLICATION_MODE: verify
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          predicate-path: ${{ steps.evidence.outputs.provenance_path }}
          predicate-type: https://slsa.dev/provenance/v1
          subject-path: ${{ steps.evidence.outputs.package_tarball }}
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.evidence.outputs.package_tarball }}
          sbom-path: ${{ steps.evidence.outputs.sbom_path }}
      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}-${{ matrix.version }}-${{ needs.plan.outputs.head_sha }}
          path: |
            ${{ steps.evidence.outputs.package_tarball }}
            ${{ steps.evidence.outputs.provenance_path }}
            ${{ steps.evidence.outputs.sbom_path }}
            ${{ steps.evidence.outputs.evidence_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  verify:
    if: >-
      always()
      && needs.plan.outputs.release == 'true'
      && needs.check.result == 'success'
      && (needs.publish.result == 'success' || needs.repair.result == 'success')
    needs:
      - plan
      - check
      - publish
      - repair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.head_sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@authmodules'
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Download release evidence
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-${{ needs.plan.outputs.head_sha }}
          path: ${{ runner.temp }}/release-evidence
          merge-multiple: true
      - name: Verify published packages and clean consumer
        run: node scripts/verify-release-publication.js
        env:
          AUTHMODULES_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          AUTHMODULES_EVIDENCE_DIRECTORY: ${{ runner.temp }}/release-evidence
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    if: needs.plan.outputs.release == 'true'
    needs:
      - plan
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.head_sha }}
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          path: .release-tooling
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve component release state
        id: release_state
        run: node .release-tooling/scripts/resolve-github-release-state.js
        env:
          AUTHMODULES_RELEASE_MATRIX: ${{ needs.plan.outputs.matrix }}
          AUTHMODULES_RELEASE_SHA: ${{ needs.plan.outputs.head_sha }}
          AUTHMODULES_RELEASE_STATE_MODE: resolve
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create component tags and GitHub Releases
        if: steps.release_state.outputs.create == 'true'
        run: node .release-tooling/scripts/resolve-github-release-state.js
        env:
          AUTHMODULES_RELEASE_MATRIX: ${{ needs.plan.outputs.matrix }}
          AUTHMODULES_RELEASE_SHA: ${{ needs.plan.outputs.head_sha }}
          AUTHMODULES_RELEASE_STATE_MODE: create
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize Release Please lifecycle
        if: >-
          steps.release_state.outputs.create == 'true'
          || steps.release_state.outputs.normalize == 'true'
        run: node .release-tooling/scripts/resolve-github-release-state.js
        env:
          AUTHMODULES_RELEASE_MATRIX: ${{ needs.plan.outputs.matrix }}
          AUTHMODULES_RELEASE_SHA: ${{ needs.plan.outputs.head_sha }}
          AUTHMODULES_RELEASE_STATE_MODE: normalize
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify component tags and GitHub Releases
        run: node .release-tooling/scripts/resolve-github-release-state.js
        env:
          AUTHMODULES_RELEASE_MATRIX: ${{ needs.plan.outputs.matrix }}
          AUTHMODULES_RELEASE_SHA: ${{ needs.plan.outputs.head_sha }}
          AUTHMODULES_RELEASE_STATE_MODE: verify
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
