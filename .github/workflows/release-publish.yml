name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - .release-please-manifest.json

concurrency:
  group: release-publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.release_plan.outputs.count }}
      matrix: ${{ steps.release_plan.outputs.matrix }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Create changed package matrix
        id: release_plan
        run: node scripts/create-release-plan.js
        env:
          AUTHMODULES_BASE_SHA: ${{ github.event.before }}

  check:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: authmodules
          POSTGRES_PASSWORD: authmodules
          POSTGRES_USER: authmodules
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authmodules -d authmodules"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - name: Install workspace dependencies
        run: npm ci
      - name: Check exact release commit
        run: npm run check
        env:
          AUTHMODULES_POSTGRES_URL: postgres://authmodules:authmodules@127.0.0.1:5432/authmodules

  publish:
    needs:
      - plan
      - check
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-packages
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@authmodules'
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - name: Install workspace dependencies
        run: npm ci
      - name: Build package
        run: npm run build --workspace "${PACKAGE_NAME}"
        env:
          PACKAGE_NAME: ${{ matrix.package }}
      - name: Prepare exact tarball and SBOM
        id: package
        run: node scripts/prepare-package-release.js
        env:
          AUTHMODULES_PACKAGE_DIRECTORY: ${{ matrix.path }}
          AUTHMODULES_OUTPUT_DIRECTORY: ${{ runner.temp }}/release/${{ matrix.name }}
      - name: Resolve registry publication state
        id: publication
        run: node scripts/resolve-package-publication.js
        env:
          AUTHMODULES_EXPECTED_INTEGRITY: ${{ steps.package.outputs.package_integrity }}
          AUTHMODULES_PACKAGE_DIRECTORY: ${{ matrix.path }}
          AUTHMODULES_PACKAGE_TARBALL: ${{ steps.package.outputs.package_tarball }}
          AUTHMODULES_PUBLICATION_MODE: resolve
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact tarball to GitHub Packages
        if: steps.publication.outputs.publish == 'true'
        run: npm publish "${PACKAGE_TARBALL}" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.package_tarball }}
      - name: Verify registry package integrity
        run: node scripts/resolve-package-publication.js
        env:
          AUTHMODULES_EXPECTED_INTEGRITY: ${{ steps.package.outputs.package_integrity }}
          AUTHMODULES_PACKAGE_DIRECTORY: ${{ matrix.path }}
          AUTHMODULES_PACKAGE_TARBALL: ${{ steps.package.outputs.package_tarball }}
          AUTHMODULES_PUBLICATION_MODE: verify
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.package_tarball }}
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.package_tarball }}
          sbom-path: ${{ steps.package.outputs.sbom_path }}

  consumer:
    needs:
      - plan
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@authmodules'
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Verify published package set
        run: node scripts/check-packed-consumer.js
        env:
          AUTHMODULES_PUBLISHED: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    needs:
      - plan
      - consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Create component tags and GitHub Releases
        run: |
          while IFS= read -r package; do
            name="$(jq -r '.name' <<<"$package")"
            package_path="$(jq -r '.path' <<<"$package")"
            version="$(jq -r '.version' <<<"$package")"
            tag="${name}-v${version}"
            tag_target="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"

            if [[ -n "$tag_target" && "$tag_target" != "$RELEASE_SHA" ]]; then
              echo "$tag points to $tag_target instead of $RELEASE_SHA" >&2
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$tag already exists"
              continue
            fi

            notes_file="$RUNNER_TEMP/${name}-${version}.md"
            node scripts/release-notes.js "$package_path/CHANGELOG.md" "$version" > "$notes_file"
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "${name}: v${version}" \
              --notes-file "$notes_file"
          done < <(jq -c '.include[]' <<<"$RELEASE_MATRIX")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MATRIX: ${{ needs.plan.outputs.matrix }}
          RELEASE_SHA: ${{ github.sha }}
