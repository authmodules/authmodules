name: Publish package

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable ecosystem release plan identifier, for example 0.1.0
        required: true
        type: string

concurrency:
  group: publish-${{ github.repository }}-${{ inputs.release_id }}
  cancel-in-progress: false

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    if: github.repository == 'authmodules/__PACKAGE__' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-packages
    steps:
      - name: Checkout immutable release plan
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: authmodules/authmodules
          ref: refs/tags/release-plan/v${{ inputs.release_id }}
          path: release-plan
      - name: Resolve package release
        id: release
        run: node scripts/resolve-package-release.js
        working-directory: release-plan
        env:
          AUTHMODULES_PACKAGE_KEY: __PACKAGE__
          AUTHMODULES_PACKAGE_REPOSITORY: ${{ github.repository }}
          AUTHMODULES_RELEASE_ID: ${{ inputs.release_id }}
      - name: Checkout exact package tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ steps.release.outputs.package_tag }}
          path: __PACKAGE__
      - name: Checkout exact contracts release
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: authmodules/contracts
          ref: refs/tags/${{ steps.release.outputs.contracts_tag }}
          path: contracts
      - name: Verify immutable package sources
        run: node scripts/verify-package-release.js
        working-directory: release-plan
        env:
          AUTHMODULES_CONTRACTS_DIRECTORY: ../contracts
          AUTHMODULES_PACKAGE_DIRECTORY: ../__PACKAGE__
          AUTHMODULES_PACKAGE_KEY: __PACKAGE__
          AUTHMODULES_PACKAGE_REPOSITORY: ${{ github.repository }}
          AUTHMODULES_RELEASE_ID: ${{ inputs.release_id }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: __PACKAGE__/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@authmodules'
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - name: Install package dependencies
        run: npm ci --omit=peer --legacy-peer-deps
        working-directory: __PACKAGE__
      - name: Check package
        run: npm run check
        working-directory: __PACKAGE__
      - name: Prepare exact tarball and SBOM
        if: hashFiles('release-plan/scripts/prepare-package-release-evidence.js') != ''
        id: evidence
        run: node scripts/prepare-package-release-evidence.js
        working-directory: release-plan
        env:
          AUTHMODULES_CONTRACTS_DIRECTORY: ../contracts
          AUTHMODULES_EVIDENCE_DIRECTORY: ${{ runner.temp }}/release-evidence
          AUTHMODULES_EXPECTED_INTEGRITY: ${{ steps.release.outputs.package_integrity }}
          AUTHMODULES_PACKAGE_DIRECTORY: ../__PACKAGE__
      - name: Resolve registry publication state
        id: publication
        run: node scripts/resolve-package-publication.js
        working-directory: release-plan
        env:
          AUTHMODULES_PACKAGE_DIRECTORY: ../__PACKAGE__
          AUTHMODULES_EXPECTED_INTEGRITY: ${{ steps.release.outputs.package_integrity }}
          AUTHMODULES_PUBLICATION_MODE: resolve
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact tarball to GitHub Packages
        if: steps.publication.outputs.publish == 'true' && steps.evidence.outputs.package_tarball != ''
        run: npm publish "${{ steps.evidence.outputs.package_tarball }}" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish legacy release to GitHub Packages
        if: steps.publication.outputs.publish == 'true' && steps.evidence.outputs.package_tarball == ''
        run: npm publish --ignore-scripts
        working-directory: __PACKAGE__
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify registry package integrity
        run: node scripts/resolve-package-publication.js
        working-directory: release-plan
        env:
          AUTHMODULES_PACKAGE_DIRECTORY: ../__PACKAGE__
          AUTHMODULES_EXPECTED_INTEGRITY: ${{ steps.release.outputs.package_integrity }}
          AUTHMODULES_PUBLICATION_MODE: verify
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        if: steps.evidence.outputs.package_tarball != ''
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.evidence.outputs.package_tarball }}
      - name: Attest SBOM
        if: steps.evidence.outputs.package_tarball != ''
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.evidence.outputs.package_tarball }}
          sbom-path: ${{ steps.evidence.outputs.sbom_path }}
      - name: Upload release evidence
        if: steps.evidence.outputs.package_tarball != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ steps.release.outputs.package_tag }}-evidence
          path: |
            ${{ steps.evidence.outputs.package_tarball }}
            ${{ steps.evidence.outputs.sbom_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
